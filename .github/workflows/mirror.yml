name: Mirror to Codeberg

on: push

jobs:
  to_codeberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: "git@codeberg.org:yast/yaqtlib.git"
          ssh_private_key: ${{ secrets.CODEBERG_MIRROR_SSH }}